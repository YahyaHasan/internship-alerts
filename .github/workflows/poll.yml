name: Internship Poller
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without Telegram credentials (no messages sent, seen.json/skipped_log.json still updated)'
        type: boolean
        default: false

permissions:
  contents: write
  models: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poller
        run: |
          set -x
          set +e
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" = "true" ]; then
            python poll.py --dry-run
          else
            python poll.py
          fi
          exit_code=$?
          set -e
          echo "poll.py exited with code $exit_code"
          exit $exit_code
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit seen.json and skipped_log.json
        run: |
          git config user.name "internship-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json skipped_log.json
          git diff --staged --quiet || git commit -m "chore: update seen [skip ci]"
          git push
