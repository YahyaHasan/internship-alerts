name: Tesla Playwright Probe (throwaway)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Probe tesla.com with headless Chromium
        run: |
          python3 << 'EOF'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
              )
              page = context.new_page()
              for url in ["https://www.tesla.com/", "https://www.tesla.com/careers/search/"]:
                  try:
                      resp = page.goto(url, timeout=20000)
                      print(url, "-> status", resp.status)
                      print(page.content()[:300])
                      print("---")
                  except Exception as e:
                      print(url, "-> ERROR", e)
              browser.close()
          EOF
